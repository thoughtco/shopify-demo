{{# Markets mode: switch country to see that market's prices (Shopify contextual pricing) #}}
{{ if config:shopify.multi_store.enabled }}
    <div class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
        <button
            type="button"
            class="inline-flex items-center gap-1.5 rounded-full px-3 py-2 text-sm transition hover:bg-sand"
            @click="open = ! open"
            :aria-expanded="open"
            aria-label="Choose your country"
        >
            <span x-text="$store.market.current?.flag ?? ''"></span>
            <span x-text="$store.market.current?.currency_code ?? ''"></span>
            <svg class="size-3.5 text-stone" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.17l3.71-3.94a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" /></svg>
        </button>

        <div
            x-cloak
            x-show="open"
            x-transition.origin.top.right
            class="absolute right-0 mt-2 w-60 overflow-hidden rounded-2xl border border-ink/8 bg-white p-1.5 shadow-xl shadow-ink/5"
        >
            <p class="px-3 pt-2 pb-1 text-xs text-stone">Prices come from Shopify Markets</p>
            <template x-for="(market, code) in $store.market.markets" :key="code">
                <button
                    type="button"
                    class="flex w-full items-center justify-between rounded-xl px-3 py-2 text-left text-sm hover:bg-sand"
                    :class="code === $store.market.code && 'bg-sand'"
                    @click="$store.market.set(code); open = false"
                >
                    <span><span x-text="market.flag"></span> <span x-text="market.name"></span></span>
                    <span class="text-stone" x-text="market.currency_code"></span>
                </button>
            </template>
        </div>
    </div>
{{ /if }}
