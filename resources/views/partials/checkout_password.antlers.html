{{# Shopify development stores password-protect the storefront, including checkout #}}
{{ if config:demo.checkout_password }}
    <p class="mt-3 rounded-xl bg-white/70 px-4 py-3 text-xs leading-relaxed text-stone ring-1 ring-ink/8">
        Checkout is password protected because this is a Shopify development store.
        Password: <code class="rounded bg-sand px-1.5 py-0.5 font-mono text-ink">{{ config:demo.checkout_password }}</code>
    </p>
{{ /if }}
