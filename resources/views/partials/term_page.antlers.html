{{# A Shopify collection, product type, vendor or tag: all imported as Statamic taxonomy terms #}}
<section class="container-page pt-12 pb-16">
    <div class="grid items-end gap-8 {{ featured_image ?= 'md:grid-cols-[1fr_minmax(0,22rem)]' }}">
        <div>
            <a href="/shop" class="eyebrow hover:text-ink">{{ taxonomy:title | replace('Product ', '') }}</a>
            <h1 class="mt-3 font-serif text-5xl tracking-tight">{{ title }}</h1>
            {{ if content }}<div class="mt-4 max-w-xl text-lg leading-relaxed text-stone">{{ content }}</div>{{ /if }}
        </div>
        {{ featured_image }}
            <img src="{{ glide:url width="700" height="500" fit="crop_focal" }}" alt="" class="hidden aspect-[7/5] rounded-2xl object-cover md:block">
        {{ /featured_image }}
    </div>

    {{ slot }}
</section>
