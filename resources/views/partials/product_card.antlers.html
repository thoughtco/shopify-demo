<article class="group relative">
    <div class="relative aspect-[4/5] overflow-hidden rounded-2xl bg-sand">
        {{ featured_image }}
            <img
                src="{{ glide:url width="640" height="800" fit="crop_focal" }}"
                alt="{{ alt ?? title }}"
                loading="lazy"
                class="absolute inset-0 size-full object-cover transition duration-700 group-hover:scale-[1.03]"
            >
        {{ /featured_image }}
        {{ gallery limit="1" offset="1" }}
            <img
                src="{{ glide:url width="640" height="800" fit="crop_focal" }}"
                alt=""
                loading="lazy"
                class="absolute inset-0 size-full object-cover opacity-0 transition duration-700 group-hover:opacity-100"
            >
        {{ /gallery }}

        <div class="absolute top-3 left-3 flex gap-1.5">
            {{ if ! in_stock }}
                <span class="rounded-full bg-white/90 px-2.5 py-1 text-[0.68rem] font-medium tracking-wide text-stone uppercase">Sold out</span>
            {{ elseif on_sale }}
                <span class="rounded-full bg-rose px-2.5 py-1 text-[0.68rem] font-medium tracking-wide text-white uppercase">Sale</span>
            {{ /if }}
        </div>
    </div>

    <div class="mt-4 flex items-start justify-between gap-4">
        <div>
            <h3 class="font-medium">
                <a href="{{ url }}" class="before:absolute before:inset-0">{{ title }}</a>
            </h3>
            {{ vendor limit="1" }}<p class="mt-0.5 text-sm text-stone">{{ title }}</p>{{ /vendor }}
        </div>
        <p class="shrink-0 text-sm whitespace-nowrap">{{ partial:partials/price }}</p>
    </div>
</article>
