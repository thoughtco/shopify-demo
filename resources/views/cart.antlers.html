<section class="container-page pt-12 pb-16" x-data="{ cart: $store['statamic.shopify.cart'] }">
    <h1 class="font-serif text-5xl tracking-tight">{{ title }}</h1>

    <template x-if="! cart.lineItems.length">
        <div class="mt-10 rounded-2xl bg-sand px-6 py-20 text-center">
            <p class="font-serif text-2xl">Your bag is empty</p>
            <a href="/shop" class="btn btn-primary mt-6">Browse the shop</a>
        </div>
    </template>

    <div x-show="cart.lineItems.length" x-cloak class="mt-10 grid gap-12 lg:grid-cols-[1fr_22rem]">
        <ul class="divide-y divide-ink/10 border-y border-ink/10">
            <template x-for="item in cart.lineItems" :key="item.id">
                <li class="flex gap-5 py-6">
                    <div class="size-28 shrink-0 overflow-hidden rounded-xl bg-sand sm:size-32">
                        <img x-show="item.image" :src="item.image" :alt="item.title" class="size-full object-cover">
                    </div>
                    <div class="flex grow flex-col">
                        <div class="flex justify-between gap-4">
                            <div>
                                <p class="text-lg font-medium" x-text="item.title"></p>
                                <p class="text-stone" x-show="item.variant.title !== 'Default Title'" x-text="item.variant.title"></p>
                                <p class="mt-1 inline-flex items-center rounded-full bg-sage/15 px-2.5 py-0.5 text-xs text-sage" x-show="item.sellingPlan" x-text="item.sellingPlan?.label"></p>
                                <p class="mt-1 text-sm text-stone" x-text="item.price + ' each'"></p>
                            </div>
                            <div class="text-right">
                                <p class="text-lg" x-text="item.subtotal"></p>
                                <p class="text-sm text-stone" x-show="item.discount" x-text="'−' + item.discount"></p>
                            </div>
                        </div>
                        <div class="mt-auto flex items-center gap-6 pt-4">
                            <div class="inline-flex items-center rounded-full border border-ink/15">
                                <button type="button" class="px-4 py-1.5 text-stone hover:text-ink" @click="item.qty > 1 ? cart.updateQuantity(item.id, item.qty - 1) : cart.removeLine(item.id)" aria-label="Decrease quantity">−</button>
                                <span class="w-6 text-center" x-text="item.qty"></span>
                                <button type="button" class="px-4 py-1.5 text-stone hover:text-ink" @click="cart.updateQuantity(item.id, item.qty + 1)" aria-label="Increase quantity">+</button>
                            </div>
                            <button type="button" class="text-sm text-stone link-underline" @click="cart.removeLine(item.id)">Remove</button>
                        </div>
                    </div>
                </li>
            </template>
        </ul>

        <aside class="h-fit rounded-2xl bg-sand p-6 lg:sticky lg:top-28">
            <label class="block text-sm font-medium" for="note">Gift note</label>
            <textarea id="note" rows="3" class="mt-2 w-full rounded-xl border border-ink/10 bg-white p-3 text-sm" placeholder="Saved on the Shopify cart" x-model.lazy="cart.note" @change="cart.setNote($event.target.value)"></textarea>

            {{ partial:partials/cart_codes }}

            <div class="mt-4 flex items-baseline justify-between border-t border-ink/10 pt-4">
                <span class="text-stone">Subtotal</span>
                <span class="font-serif text-3xl" x-text="cart.itemsTotal"></span>
            </div>
            <p class="mt-1 text-xs text-stone">Shipping and taxes are worked out at checkout.</p>
            <a :href="cart.checkoutUrl" class="btn btn-primary mt-6 w-full">Checkout with Shopify</a>
            {{ partial:partials/checkout_password }}
            <p class="mt-4 text-xs leading-relaxed text-stone">This is a Shopify development store, so checkout is in test mode: nothing is charged or shipped.</p>
        </aside>
    </div>
</section>
